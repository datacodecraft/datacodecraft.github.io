<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>WEIRD ANIMAL GALLERY</title>

<style>

body {
    text-align: center;
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
}

h1 {
    color: darkgreen;
}

.gallery-item {
    display: inline-block;
    margin: 20px;
}

img {
    height: 250px;
    border: 3px solid black;
    border-radius: 10px;
}

p {
    font-weight: bold;
    margin-top: 10px;
}

</style>
</head>

<body>

<h1>WEIRD ANIMAL GALLERY</h1>

<div class="gallery-item">
    <img src="images/mudskipper.jpg" alt="Mudskipper Fish">
    <p>Mudskipper Fish</p>
</div>

<div class="gallery-item">
    <img src="images/saiga_antelope.jpg" alt="Saiga Antelope">
    <p>Saiga Antelope</p>
</div>

<div class="gallery-item">
    <img src="images/maned_wolf.jpg" alt="Maned Wolf">
    <p>Maned Wolf</p>
</div>

</body>

</html>
